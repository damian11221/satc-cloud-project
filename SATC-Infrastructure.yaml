AWSTemplateFormatVersion: '2010-09-09'
Description: >
  SATC Infrastructure as Code demonstration stack. Creates a separate VPC,
  one public subnet, one private subnet, an internet gateway, route table,
  security group, and outputs.

Parameters:
  VpcCIDR:
    Type: String
    Default: 10.10.0.0/16
  PublicSubnetCIDR:
    Type: String
    Default: 10.10.1.0/24
  PrivateSubnetCIDR:
    Type: String
    Default: 10.10.11.0/24

Resources:
  SATCVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: SATC-IaC-VPC

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: SATC-IaC-IGW

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref SATCVPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SATCVPC
      CidrBlock: !Ref PublicSubnetCIDR
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: SATC-IaC-Public-Subnet

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SATCVPC
      CidrBlock: !Ref PrivateSubnetCIDR
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: SATC-IaC-Private-Subnet

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SATCVPC
      Tags:
        - Key: Name
          Value: SATC-IaC-Public-RT

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SATC web security group
      VpcId: !Ref SATCVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: SATC-IaC-Web-SG

Outputs:
  VpcId:
    Description: SATC IaC VPC ID
    Value: !Ref SATCVPC
  PublicSubnetId:
    Description: Public subnet ID
    Value: !Ref PublicSubnet
  PrivateSubnetId:
    Description: Private subnet ID
    Value: !Ref PrivateSubnet
  WebSecurityGroupId:
    Description: Web security group ID
    Value: !Ref WebSecurityGroup
